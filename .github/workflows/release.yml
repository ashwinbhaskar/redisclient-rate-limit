name: Release

on:
  push:
    tags: [ 'v*' ]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - name: Publish to Maven Central
        env:
          # Sonatype Central Portal user token (not the account login).
          SONATYPE_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.OSSRH_PASSWORD }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          PGP_PASSPHRASE: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          # sbt-ci-release imports PGP_SECRET with `base64 --decode | gpg --import`.
          # Accept SIGNING_KEY either as an ASCII-armored key or already base64-encoded.
          if printf '%s' "$SIGNING_KEY" | grep -q -- '-----BEGIN PGP PRIVATE KEY BLOCK-----'; then
            PGP_SECRET=$(printf '%s\n' "$SIGNING_KEY" | base64 -w0)
          else
            PGP_SECRET=$(printf '%s' "$SIGNING_KEY" | tr -d ' \r\n')
          fi
          echo "::add-mask::$PGP_SECRET"
          export PGP_SECRET
          sbt ci-release
