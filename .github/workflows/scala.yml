name: Scala CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [ '11', '17', '21' ]
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-java@v6
      with:
        java-version: ${{ matrix.java }}
        distribution: 'temurin'
        cache: sbt
    - uses: sbt/setup-sbt@v1
    - name: Run tests
      run: sbt test

  checks:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-java@v6
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: sbt
    - uses: sbt/setup-sbt@v1
    - name: Check formatting and binary compatibility
      run: sbt scalafmtCheckAll scalafmtSbtCheck mimaReportBinaryIssues
